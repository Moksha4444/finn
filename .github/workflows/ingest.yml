# Daily feed refresh: filings + prices for the portfolio -> web/public/data/feed.json, committed only when the data
# changed, so Vercel redeploys. No PvD or bull/bear here (those are batch jobs run by hand).
# Render is not touched: its build filter is backend/**, and this commits only web/public/data/ and cache/llm/.
name: Refresh feed

on:
  schedule:
    - cron: "7 3 * * *"   # 08:37 IST: fills yesterday's reaction bars (yfinance posts them late)
    - cron: "7 13 * * *"  # 18:37 IST: today's filings after market close
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # Downloaded filings and screener pages, so each run doesn't re-fetch 30 days of PDFs.
      # The LLM answers (cache/llm/) are committed, so no model call is repeated across runs.
      - uses: actions/cache@v4
        with:
          path: cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      # Refuses (exit 1, feed untouched) if >2 tickers fail or Nifty has no prices; a failed ticker keeps its last good data.
      - name: Ingest (30-day window)
        working-directory: backend
        run: python -m finn.ingest --days 30 > ../ingest.log && tail -40 ../ingest.log

      - name: Model spend this run
        run: |
          python - <<'EOF'
          import json, pathlib
          f = pathlib.Path("cache/llm_calls.jsonl")
          r = [json.loads(l) for l in f.read_text().splitlines()] if f.exists() else []
          print(f"{len(r)} model calls, ${sum(x['usd'] for x in r):.4f} at list prices")
          EOF

      - name: Did the data change?
        id: diff
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess
          f = "web/public/data/feed.json"
          new = json.load(open(f, encoding="utf-8"))
          old = json.loads(subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True, encoding="utf-8").stdout or "{}")
          for d in (new, old):
              d.pop("generated_at", None)  # the run time alone isn't a change
          print(f"changed={'true' if new != old else 'false'}")
          EOF

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "finn-ingest"
          git config user.email "finn-ingest@users.noreply.github.com"
          git add web/public/data/feed.json cache/llm
          git commit -m "data: feed refresh $(date '+%d %b %H:%M IST')"
          git pull --rebase
          git push
