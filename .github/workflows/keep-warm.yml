# Render's free tier sleeps after 15 idle minutes and takes 30-60 s to wake; a ping every ~10 min keeps live research
# responsive. GitHub may delay scheduled runs, so an occasional cold start can still happen.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://finn-api-72tc.onrender.com/health
